name: Test Formulas

on:
  push:
    branches: [main]
    paths:
      - "Formula/*.rb"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "Formula/*.rb"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  audit:
    name: Audit formulas
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Audit SnapDog formulas
        run: |
          brew audit --strict --online snapdogrocks/tap/snapdog
          brew audit --strict --online snapdogrocks/tap/snapdog-client
